<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.5); }
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: -0.5px;
        text-anchor: middle;
        animation: float 4s ease-in-out infinite;
        transform-origin: center;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #94a3b8;
        text-anchor: middle;
        animation: float 4s ease-in-out infinite;
        animation-delay: 0.5s;
        transform-origin: center;
      }
      .animated-circle {
        animation: twinkle 3s infinite ease-in-out;
        transform-origin: center;
      }
      .bar-glow {
        animation: pulse 3s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>
  <rect width="800" height="250" fill="url(#bgGrad)" />
  <rect width="800" height="250" fill="url(#grid)" />
  <circle cx="400" cy="125" r="300" fill="url(#glow)" />
  
  <g>
    <text x="400" y="105" class="title-text" fill="url(#textGrad)">ENTERPRISE UNIFIED SEARCH</text>
    <text x="400" y="152" class="subtitle-text">Curated AI Search Engines, RAG Systems &amp; Knowledge Hubs</text>
  </g>
  
  <rect class="bar-glow" x="260" y="180" width="280" height="4" rx="2" fill="url(#textGrad)" fill-opacity="0.85" />
  
  <circle class="animated-circle" cx="70" cy="55" r="3" fill="#38bdf8" style="animation-delay: 0s;" />
  <circle class="animated-circle" cx="730" cy="195" r="3.5" fill="#c084fc" style="animation-delay: 0.8s;" />
  <circle class="animated-circle" cx="110" cy="210" r="2.5" fill="#818cf8" style="animation-delay: 1.5s;" />
  <circle class="animated-circle" cx="690" cy="65" r="3" fill="#38bdf8" style="animation-delay: 2.2s;" />
  <circle class="animated-circle" cx="190" cy="75" r="2" fill="#c084fc" style="animation-delay: 1.1s;" />
  <circle class="animated-circle" cx="620" cy="215" r="2.5" fill="#38bdf8" style="animation-delay: 1.7s;" />
</svg>
